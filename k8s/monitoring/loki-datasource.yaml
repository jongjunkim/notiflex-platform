# Grafana Loki 데이터소스.
# Grafana 사이드카가 label grafana_datasource=1 인 ConfigMap을 자동으로 프로비저닝한다.
# loki 차트 7.x는 데이터소스를 만들어주지 않으므로 직접 정의한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        # gateway를 껐으므로 loki 서비스로 직접 조회한다.
        url: http://loki.monitoring.svc.cluster.local:3100
        # Prometheus가 이미 default다. 기본 데이터소스가 둘이면 Grafana가 기동에 실패한다.
        isDefault: false
        jsonData:
          maxLines: 1000
