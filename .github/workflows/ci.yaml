# Notiflex CI/CD — app/ 이 바뀌면 이미지를 빌드해 Artifact Registry에 푸시하고,
# k8s 매니페스트의 이미지 태그를 갱신해 커밋한다. 배포 자체는 ArgoCD가 Git을 보고 수행한다.
#
# 매니페스트 커밋은 k8s/ 만 건드리므로 아래 paths 필터에 걸리지 않는다 → CI가 자신을 재귀 실행하지 않는다.
name: CI

on:
  push:
    branches: [main]
    paths:
      # 매니페스트나 문서만 고쳤을 때는 빌드하지 않는다. 워크플로 자신이 바뀌면 실행한다.
      - 'app/**'
      - '.github/workflows/ci.yaml'
  # 코드 변경 없이 파이프라인만 확인하고 싶을 때 UI/CLI에서 수동 실행한다.
  workflow_dispatch:

env:
  REGION: asia-northeast3
  REPOSITORY: notiflex
  IMAGE_NAME: api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # 매니페스트 태그를 갱신해 push해야 하므로 쓰기 권한이 필요하다.
      # 저장소 설정(Settings → Actions → Workflow permissions)도 write여야 한다. 둘 다 필요하다.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이미지 태그는 커밋 SHA 앞 7자리로 만든다.
      # 어떤 커밋이 배포됐는지 추적되고, 같은 태그를 덮어쓸 일이 없다.
      - name: Resolve image tag
        id: meta
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE_NAME}:${TAG}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "빌드할 이미지: $IMAGE"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          # 외부 의존성이 없어 go.sum이 존재하지 않는다. 캐시를 켜면 경로를 못 찾아 실패한다.
          cache: false

      # 컨테이너를 만들기 전에 코드가 성립하는지 먼저 확인한다.
      # 여기서 걸리면 이미지를 만들지 않으므로, 깨진 이미지가 레지스트리에 올라가지 않는다.
      - name: Vet and test
        working-directory: app
        run: |
          go vet ./...
          go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # docker 클라이언트가 Artifact Registry에 인증하도록 위임한다.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" app/

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image }}"

      # 여기서부터가 CD 연결부. 매니페스트의 이미지 태그를 방금 푸시한 이미지로 바꾼다.
      # ArgoCD는 클러스터가 아니라 Git을 보므로, Git을 바꾸는 것이 곧 배포 지시다.
      - name: Update manifest image tag
        env:
          # step output을 셸 변수로 직접 쓰면 값이 비어도 조용히 넘어간다.
          # env로 명시해 받고, 아래에서 빈 값이면 즉시 중단한다.
          IMAGE_URI: ${{ steps.meta.outputs.image }}
          MANIFEST: k8s/smb/deployment.yaml
        run: |
          set -euo pipefail

          # 빈 값으로 sed를 돌리면 매니페스트의 image 라인이 지워진다. 반드시 먼저 막는다.
          if [ -z "$IMAGE_URI" ]; then
            echo "::error::IMAGE_URI가 비어 있다. 태그 산출 단계를 확인하라."
            exit 1
          fi
          echo "적용할 이미지: $IMAGE_URI"

          echo "변경 전: $(grep -E '^\s*image:' "$MANIFEST")"

          # 이 저장소의 이미지 라인만 정확히 겨냥한다. 앞뒤 공백·다른 컨테이너와 섞이지 않게
          # 레지스트리 경로까지 패턴에 포함한다.
          sed -i -E \
            "s#^([[:space:]]*image:[[:space:]]*)${REGION}-docker\.pkg\.dev/[^[:space:]]+#\1${IMAGE_URI}#" \
            "$MANIFEST"

          echo "변경 후: $(grep -E '^\s*image:' "$MANIFEST")"

          # 교체가 실제로 됐는지 확인한다. 패턴이 안 맞았는데 성공으로 넘어가면
          # "CI는 초록불인데 배포는 안 되는" 최악의 상태가 된다.
          grep -qF "$IMAGE_URI" "$MANIFEST" || {
            echo "::error::매니페스트에 새 이미지가 반영되지 않았다. sed 패턴을 확인하라."
            exit 1
          }

      - name: Commit and push manifest
        run: |
          set -euo pipefail

          # 재실행 등으로 태그가 이미 같으면 빈 커밋을 만들지 않는다.
          if git diff --quiet -- k8s/smb/deployment.yaml; then
            echo "매니페스트 변경 없음 — 커밋을 건너뛴다."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/smb/deployment.yaml
          git commit -m "ci: deploy ${{ steps.meta.outputs.tag }} [skip ci]" \
                     -m "빌드 커밋: ${GITHUB_SHA}"

          # 사람이 같은 시점에 push하면 non-fast-forward로 거절된다. 몇 번 재시도한다.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "push 성공 (시도 $i회)"; exit 0
            fi
            echo "[$i] push 거절됨 — 원격 변경을 가져와 재시도한다."
            git pull --rebase origin main
          done
          echo "::error::매니페스트 push에 3회 실패했다."
          exit 1

      - name: Summary
        run: |
          {
            echo "### 배포 지시 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이미지 | \`${{ steps.meta.outputs.image }}\` |"
            echo "| 태그 | \`${{ steps.meta.outputs.tag }}\` |"
            echo ""
            echo "매니페스트가 갱신됐다. ArgoCD가 Git을 폴링해 클러스터에 반영한다(최대 3분)."
          } >> "$GITHUB_STEP_SUMMARY"
